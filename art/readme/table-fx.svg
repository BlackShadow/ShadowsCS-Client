  <text class="h" x="18" y="24">OPTION</text>
  <rect x="178.0" y="9" width="1" height="21" fill="#282e22"/><rect x="179.0" y="9" width="1" height="21" fill="#889180"/>
  <rect x="179.0" y="34" width="1" height="278" fill="#4c5844" fill-opacity="0.7"/>
  <text class="h" x="191.0" y="24">WHAT IT DOES</text>
  <text xml:space="preserve" x="18" y="55"><tspan class="b">HUD</tspan><tspan class="n"> </tspan><tspan class="b">color</tspan></text>
  <text xml:space="preserve" x="191.0" y="55"><tspan class="n">Orange, white, red, green, yellow, cyan, crimson, or the animated </tspan><tspan class="c">Rainbow</tspan><tspan class="n">, </tspan><tspan class="c">Christmas</tspan><tspan class="n"> and</tspan></text>
  <text xml:space="preserve" x="191.0" y="75"><tspan class="c">Dynamic</tspan><tspan class="n"> (health and money colored by how much you have).</tspan></text>
  <text xml:space="preserve" x="18" y="109"><tspan class="b">Menu</tspan><tspan class="n"> </tspan><tspan class="b">background</tspan></text>
  <text xml:space="preserve" x="191.0" y="109"><tspan class="c">Original</tspan><tspan class="n">, </tspan><tspan class="c">Beta</tspan><tspan class="n"> or </tspan><tspan class="c">Retail</tspan><tspan class="n"> artwork behind the main menu, or </tspan><tspan class="c">Auto</tspan><tspan class="n">, which goes round all</tspan></text>
  <text xml:space="preserve" x="191.0" y="129"><tspan class="n">three.</tspan></text>
  <text xml:space="preserve" x="18" y="163"><tspan class="b">Font</tspan><tspan class="n"> </tspan><tspan class="b">style</tspan></text>
  <text xml:space="preserve" x="191.0" y="163"><tspan class="c">WON</tspan><tspan class="n"> puts the menus in CS 1.5's fonts and the chat in the old engine's lettering.</tspan></text>
  <text xml:space="preserve" x="18" y="197"><tspan class="b">Weather</tspan></text>
  <text xml:space="preserve" x="191.0" y="197"><tspan class="n">Rain or snow on any map, outdoors.</tspan></text>
  <text xml:space="preserve" x="18" y="231"><tspan class="b">Bobbing</tspan><tspan class="n"> </tspan><tspan class="b">style</tspan></text>
  <text xml:space="preserve" x="191.0" y="231"><tspan class="n">The weapon's bob as in WON Half-Life, as in the Steam versions, or as in Source.</tspan></text>
  <text xml:space="preserve" x="18" y="265"><tspan class="b">No</tspan><tspan class="n"> </tspan><tspan class="b">sky</tspan></text>
  <text xml:space="preserve" x="191.0" y="265"><tspan class="n">Draws the sky solid black.</tspan></text>
  <text xml:space="preserve" x="18" y="299"><tspan class="b">Stretched</tspan><tspan class="n"> </tspan><tspan class="b">4:3</tspan></text>
  <text xml:space="preserve" x="191.0" y="299"><tspan class="n">The 4:3 stretched look on a 16:9 screen.</tspan></text>
</svg>
